name: Bug report
description: Report a reproducible problem in Heat Risk Map.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please do not include API tokens, personal information, or other secrets."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the map\n2. Select a forecast hour\n3. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Browser/version and desktop or mobile"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant error
      description: Redact private details and never attach credentials.
    validations:
      required: false
